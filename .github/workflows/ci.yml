name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check (host & client)
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Syntax check (bridge)
        run: python -m py_compile scripts/wb_bridge.py
      - name: Manifest sanity
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh.bundle.patch) throw new Error('missing dsh.bundle.patch'); if(!p.dsh.client) throw new Error('missing dsh.client'); if(!p.repository) throw new Error('missing repository'); console.log('manifest ok', p.version)"
      - name: Patch yaml parses
        run: node -e "const fs=require('fs'); const t=fs.readFileSync('cordis.patch.yml','utf8'); if(!/- insert:/.test(t) && !/- id:/.test(t)) throw new Error('patch yaml has no entries'); console.log('patch ok')"
